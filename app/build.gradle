plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'cz.mkdaniel.enterprisemessenger'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "cz.mkdaniel.enterprisemessenger"
        minSdk 35
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        // The crypto classes log through android.util.Log, whose stubs throw in a JVM unit test.
        // Returning default values keeps Log.d/Log.w inert there, so the sealing and key-registry
        // logic can be tested without Robolectric.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.material
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.okhttp
    implementation libs.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
